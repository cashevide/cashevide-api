services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Check if the database is ready to accept connections
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env
    environment:
      # Use the service name 'db' as the database host
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}
      - XDG_CACHE_HOME=/tmp
    depends_on:
      db:
        # Wait for the database healthcheck to pass before starting the web service
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - default
      - proxy-network
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: cashevide_redis
    restart: always
    env_file:
      - .env
    command: sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  static_volume:
  media_volume:
  redis_data:

networks:
  default:
  proxy-network:
    external: true

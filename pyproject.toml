[project]
name = "cashevide-api"
version = "0.1.0"
description = "An open-source initiative to ensure payment security and client transparency for freelancers. Built with transparency, powered by Python & Django."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.42.61",
  "dj-database-url>=3.1.2",
  "django>=6.0.1",
  "django-cleanup>=9.0.0",
  "django-cors-headers>=4.9.0",
  "django-filter>=25.2",
  "django-redis>=6.0.0",
  "django-storages>=1.14.6",
  "djangorestframework>=3.16.1",
  "djangorestframework-simplejwt>=5.5.1",
  "drf-spectacular>=0.29.0",
  "drf-writable-nested>=0.7.2",
  "gunicorn>=25.1.0",
  "phonenumbers>=9.0.23",
  "pillow>=12.1.1",
  "psycopg2-binary>=2.9.11",
  "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
  "django-stubs>=5.2.9",
  "django-stubs-ext>=5.2.9",
  "django-types>=0.22.0",
  "djangorestframework-stubs>=3.16.7",
  "requests>=2.33.1",
  "ruff>=0.15.7",
]

[tool.pyright]
reportIncompatibleVariableOverride = false

[tool.ruff]
line-length = 88

exclude = [".git", ".venv", "venv", "env", "migrations"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "DJ", # flake8-django
]
ignore = []

[tool.ruff.format]
quote-style = "double"
